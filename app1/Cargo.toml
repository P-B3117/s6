[workspace]
resolver = "3"
members = ["hub","sensor", "shared"]

[workspace.dependencies]
bt-hci = { version = "0.8.1", features = ["defmt"] }
critical-section = "1.2.0"
defmt = "1.0.1"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embedded-graphics = { version = "0.8.1", features = ["defmt"] }
embedded-hal-bus = "0.3.0"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.10.0", features = ["defmt"] }
esp-backtrace = { version = "0.19.0", features = [
    "defmt",
    "esp32",
    "panic-handler",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32"] }
esp-hal = { version = "1.1.0", features = ["defmt", "esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["defmt-espflash", "esp32"] }
esp-radio = { version = "0.18.0", features = ["defmt", "esp32", "unstable", "ble"] }
esp-rtos = { version = "0.3.0", features = [
    "defmt",
    "embassy",
    "esp-radio",
    "esp32",
] }
heapless = "0.9.3"
static_cell = "2.1.1"
trouble-host = { version = "0.6.0", features = ["defmt", "scan"] }
